name: Bug report
description: Report a reproducible problem in the Lume demo.
title: "fix: "
labels: ["bug"]
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What is broken or confusing?
      placeholder: The cart drawer...
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Use demo data only.
      placeholder: |
        1. Open the catalog
        2. Filter by size
        3. Add an item to cart
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: dropdown
    id: viewport
    attributes:
      label: Viewport
      options:
        - Desktop
        - Mobile
        - Both
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Screenshots, console errors, or links.
